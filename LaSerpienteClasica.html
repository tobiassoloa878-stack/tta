<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Basic Mobile</title>
    <style>
        * { margin: 0; padding: 0; touch-action: none; }
        body { 
            background: #111; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            color: #0f4;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas { 
            border: 2px solid #555; 
            background: #000; 
            box-shadow: 0 0 20px rgba(0,255,65,0.2);
        }
        #score { margin-bottom: 10px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="score">PUNTOS: 0</div>
    <canvas id="snakeCanvas"></canvas>
    <p style="margin-top:10px; font-size:12px; color:#666;">Desliza para mover a la serpiente</p>

<script>
window.onload = function() {
    const canvas = document.getElementById("snakeCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");

    // Configuración fija para evitar errores de escala
    const size = 300;
    canvas.width = size;
    canvas.height = size;
    
    const box = 20; // Tamaño de cada cuadro
    let score = 0;
    let snake = [{x: 8 * box, y: 8 * box}];
    let food = {
        x: Math.floor(Math.random() * 14 + 1) * box,
        y: Math.floor(Math.random() * 14 + 1) * box
    };
    let d = "RIGHT";

    // --- CONTROLES MÓVIL (SWIPE) ---
    let touchX = null;
    let touchY = null;

    document.addEventListener('touchstart', (e) => {
        touchX = e.touches[0].clientX;
        touchY = e.touches[0].clientY;
    }, false);

    document.addEventListener('touchmove', (e) => {
        if (!touchX || !touchY) return;
        
        let diffX = touchX - e.touches[0].clientX;
        let diffY = touchY - e.touches[0].clientY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 0 && d !== "RIGHT") d = "LEFT";
            else if (diffX < 0 && d !== "LEFT") d = "RIGHT";
        } else {
            if (diffY > 0 && d !== "DOWN") d = "UP";
            else if (diffY < 0 && d !== "UP") d = "DOWN";
        }
        
        touchX = null;
        touchY = null;
        e.preventDefault();
    }, {passive: false});

    // --- CONTROLES TECLADO ---
    document.addEventListener("keydown", (e) => {
        if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
        else if(e.keyCode == 38 && d != "DOWN") d = "UP";
        else if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
        else if(e.keyCode == 40 && d != "UP") d = "DOWN";
    });

    function draw() {
        // 1. Limpiar fondo
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Dibujar serpiente
        for(let i = 0; i < snake.length; i++) {
            ctx.fillStyle = (i == 0) ? "#0f4" : "#081";
            ctx.fillRect(snake[i].x, snake[i].y, box - 2, box - 2);
        }

        // 3. Dibujar comida
        ctx.fillStyle = "red";
        ctx.fillRect(food.x, food.y, box - 2, box - 2);

        // 4. Lógica de movimiento
        let snakeX = snake[0].x;
        let snakeY = snake[0].y;

        if( d == "LEFT") snakeX -= box;
        if( d == "UP") snakeY -= box;
        if( d == "RIGHT") snakeX += box;
        if( d == "DOWN") snakeY += box;

        // 5. Comer
        if(snakeX == food.x && snakeY == food.y) {
            score++;
            scoreEl.innerHTML = "PUNTOS: " + score;
            food = {
                x: Math.floor(Math.random() * 14 + 1) * box,
                y: Math.floor(Math.random() * 14 + 1) * box
            };
        } else {
            snake.pop();
        }

        let newHead = { x: snakeX, y: snakeY };

        // 6. Game Over (Paredes o Cuerpo)
        if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
            // Reinicio instantáneo
            snake = [{x: 8 * box, y: 8 * box}];
            d = "RIGHT";
            score = 0;
            scoreEl.innerHTML = "PUNTOS: 0";
        } else {
            snake.unshift(newHead);
        }
    }

    function collision(head, array) {
        for(let i = 0; i < array.length; i++) {
            if(head.x == array[i].x && head.y == array[i].y) return true;
        }
        return false;
    }

    // Usamos setInterval para mayor compatibilidad en móviles antiguos/básicos
    setInterval(draw, 120);
};
</script>
</body>
</html>
